    <!-- Interactive Scripts -->
    <script>
        // Automatically sync with system dark/light theme preference
        const htmlElement = document.documentElement;
        if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            htmlElement.classList.add('dark');
        }
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', event => {
            if (event.matches) {
                htmlElement.classList.add('dark');
            } else {
                htmlElement.classList.remove('dark');
            }
        });

        // Clipboard Copy Function (iFrame-compatible using textarea & execCommand)
        const buttonTimeouts = {};
        function copyToClipboard(text, btnId) {
            const tempInput = document.createElement('textarea');
            tempInput.value = text;
            tempInput.style.position = 'fixed';
            tempInput.style.opacity = '0';
            document.body.appendChild(tempInput);
            tempInput.select();
            
            try {
                document.execCommand('copy');
                showFeedback(btnId);
            } catch (err) {
                console.error('Copy failed', err);
            }
            
            document.body.removeChild(tempInput);
        }

        function showFeedback(btnId) {
            const btn = document.getElementById(btnId);
            const textSpan = btn.querySelector('.copy-text');

            textSpan.textContent = 'Copied!';
            btn.classList.add('border-emerald-500', 'text-emerald-600', 'dark:text-emerald-400');

            clearTimeout(buttonTimeouts[btnId]);
            buttonTimeouts[btnId] = setTimeout(() => {
                textSpan.textContent = 'Copy';
                btn.classList.remove('border-emerald-500', 'text-emerald-600', 'dark:text-emerald-400');
            }, 2000);
        }
    </script>
